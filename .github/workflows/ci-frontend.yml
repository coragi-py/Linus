name: CI Frontend - Lint, Typecheck e Build

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20 com cache do npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: 3. Instalar dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: 4. Executar análise estática (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: 5. Validar tipagem TypeScript (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 6. Testar Build de Produção (Vite)
        working-directory: frontend
        env:
          VITE_API_URL: https://api.linus.app.br
          VITE_GOOGLE_CLIENT_ID: dummy-google-client-id
        run: npm run build