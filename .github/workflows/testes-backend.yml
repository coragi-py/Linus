name: CI Backend - Testes Automatizados

on:
  pull_request:
    branches: ["develop"]

jobs:
  testar-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 3. Instalar dependencias
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: 3.5. Criar arquivo .env temporário para CI/CD
        run: |
          cd backend
          echo 'SECRET_KEY="chave-secreta-temporaria-do-github-actions"' > .env
          echo 'DATABASE_URL="sqlite:///:memory:"' >> .env
          echo 'GOOGLE_OAUTH2_CLIENT_ID="dummy-google-client-id"' >> .env
          echo 'FRONTEND_URL="http://localhost:3000"' >> .env

      - name: 4. Rodar testes e verificar cobertura
        run: |
          cd backend
          coverage run manage.py test accounts audit glossary music placement
          coverage report -m --fail-under=50
