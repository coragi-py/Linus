name: CI Backend - Testes Automatizados

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

jobs:
  testar-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Python com cache do pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: 3. Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: 4. Criar arquivo .env temporário para CI/CD
        working-directory: backend
        run: |
          cat <<EOF > .env
          DJANGO_SECRET_KEY=chave-secreta-muito-segura-github-actions-123
          DATABASE_URL=sqlite:///:memory:
          GOOGLE_OAUTH2_CLIENT_ID=dummy-client-id
          FRONTEND_URL=http://localhost:8080
          DEFAULT_FROM_EMAIL=noreply@linus.app.br
          EOF

      - name: 5. Verificar migrações pendentes do Django
        working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run

      - name: 6. Rodar suíte completa de testes e verificar cobertura
        working-directory: backend
        run: |
          coverage run --omit="*/migrations/*,*/tests/*,manage.py" manage.py test accounts audit glossary music placement learning exercises gamification progress
          coverage report -m --fail-under=70
