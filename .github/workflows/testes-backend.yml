name: CI Backend - Testes Automatizados

on:
  pull_request:
    branches: ["develop"]

jobs:
  testar-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar o repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 3. Instalar dependencias
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: 4. Injetar Chaves de Teste (Bypass de Env)
        run: |
          # Adiciona as variáveis diretamente no final do settings.py, sobrescrevendo qualquer erro de .env
          echo "" >> backend/core/settings.py
          echo "SECRET_KEY = 'chave-secreta-garantida-ci-cd-12345'" >> backend/core/settings.py
          echo "GOOGLE_OAUTH2_CLIENT_ID = 'google-dummy-id-123'" >> backend/core/settings.py
          echo "FRONTEND_URL = 'http://localhost:3000'" >> backend/core/settings.py

      - name: 5. Rodar testes e verificar cobertura
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd backend
          coverage run manage.py test accounts audit glossary music placement
          coverage report -m --fail-under=50
